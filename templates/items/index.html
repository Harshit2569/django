<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Items</title>
  </head>
  <body>
    <h1>Items</h1>
    <form method="post">
      {% csrf_token %}
      <input type="text" name="name" placeholder="Enter item name" required>
      <button type="submit">Add item</button>
    </form>
    <ul>
      {% for item in items %}
        <li>{{ item.name }}</li>
      {% empty %}
        <li>No items yet.</li>
      {% endfor %}
    </ul>
  </body>
</html>
