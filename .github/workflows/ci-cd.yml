name: Django CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  DJANGO_SECRET_KEY: ci-secret-key
  DJANGO_DEBUG: 'False'
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1

jobs:
  ci:
    name: Test Django app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: ${{ secrets.DJANGO_DEBUG }}
          DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: DJANGO_SECRET_KEY,DJANGO_DEBUG,DJANGO_ALLOWED_HOSTS,DEPLOY_PATH
          script: |
            set -e

            : "${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY secret is required}"
            : "${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS secret is required}"
            : "${DEPLOY_PATH:?DEPLOY_PATH secret is required}"

            export DJANGO_SECRET_KEY
            export DJANGO_DEBUG="${DJANGO_DEBUG:-False}"
            export DJANGO_ALLOWED_HOSTS

            cd "$DEPLOY_PATH"
            git fetch --all
            git reset --hard "${{ github.sha }}"
            python3 -m venv .venv
            . .venv/bin/activate
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            sudo systemctl restart mysite
