name: Django CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  MYSQL_DATABASE: myproject
  MYSQL_USER: root
  MYSQL_PASSWORD: root
  MYSQL_HOST: 127.0.0.1
  MYSQL_PORT: 3306

jobs:
  ci:
    name: Test Django app
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: ${{ env.MYSQL_DATABASE }}
          MYSQL_ROOT_PASSWORD: ${{ env.MYSQL_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install MySQL client libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: ${{ secrets.DJANGO_DEBUG }}
          DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_HOST: ${{ secrets.MYSQL_HOST }}
          MYSQL_PORT: ${{ secrets.MYSQL_PORT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DJANGO_SECRET_KEY,DJANGO_DEBUG,DJANGO_ALLOWED_HOSTS,DEPLOY_PATH,MYSQL_DATABASE,MYSQL_USER,MYSQL_PASSWORD,MYSQL_HOST,MYSQL_PORT
          script: |
            set -e

            : "${DJANGO_SECRET_KEY:?Missing DJANGO_SECRET_KEY}"
            : "${DJANGO_ALLOWED_HOSTS:?Missing DJANGO_ALLOWED_HOSTS}"
            : "${DEPLOY_PATH:?Missing DEPLOY_PATH}"
            : "${MYSQL_DATABASE:?Missing MYSQL_DATABASE}"
            : "${MYSQL_USER:?Missing MYSQL_USER}"
            : "${MYSQL_PASSWORD:?Missing MYSQL_PASSWORD}"
            : "${MYSQL_HOST:?Missing MYSQL_HOST}"

            export DJANGO_SECRET_KEY
            export DJANGO_DEBUG="${DJANGO_DEBUG:-False}"
            export DJANGO_ALLOWED_HOSTS
            export MYSQL_DATABASE
            export MYSQL_USER
            export MYSQL_PASSWORD
            export MYSQL_HOST
            export MYSQL_PORT="${MYSQL_PORT:-3306}"

            cd "$DEPLOY_PATH"

            git fetch origin
            git reset --hard "origin/${{ github.ref_name }}"

            python3 -m venv .venv
            source .venv/bin/activate

            python -m pip install --upgrade pip
            pip install -r requirements.txt

            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            if [ -f django.pid ]; then
              kill "$(cat django.pid)" 2>/dev/null || true
              rm -f django.pid
            fi

            nohup python manage.py runserver 0.0.0.0:8000 > output.log 2>&1 &
            echo $! > django.pid
