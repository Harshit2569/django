name: Django CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  ci:
    name: Test Django app
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DEBUG: ${{ secrets.DJANGO_DEBUG }}
          DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DJANGO_SECRET_KEY,DJANGO_DEBUG,DJANGO_ALLOWED_HOSTS,DEPLOY_PATH
          script: |
            set -e

            : "${DJANGO_SECRET_KEY:?Missing DJANGO_SECRET_KEY}"
            : "${DJANGO_ALLOWED_HOSTS:?Missing DJANGO_ALLOWED_HOSTS}"
            : "${DEPLOY_PATH:?Missing DEPLOY_PATH}"

            export DJANGO_SECRET_KEY
            export DJANGO_DEBUG="${DJANGO_DEBUG:-False}"
            export DJANGO_ALLOWED_HOSTS

            cd "$DEPLOY_PATH"

            git fetch origin
            git reset --hard "origin/${{ github.ref_name }}"

            python3 -m venv .venv
            source .venv/bin/activate

            python -m pip install --upgrade pip
            pip install -r requirements.txt

            python manage.py migrate --noinput
            python manage.py collectstatic --noinput

            if [ -f django.pid ]; then
              kill "$(cat django.pid)" 2>/dev/null || true
              rm -f django.pid
            fi

            nohup python manage.py runserver 0.0.0.0:8000 > output.log 2>&1 &
            echo $! > django.pid
